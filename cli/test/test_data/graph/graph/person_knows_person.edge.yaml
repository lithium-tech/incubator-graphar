adj_lists: 
  - aligned_by: src
    file_type: parquet
    ordered: true
    prefix: ordered_by_source/
  - aligned_by: dst
    file_type: parquet
    ordered: true
    prefix: ordered_by_dest/
chunk_size: 20
directed: true
dst_chunk_size: 10
dst_type: person
edge_type: knows
prefix: edge/person_knows_person/
property_groups: 
  - file_type: parquet
    prefix: edge_list/
    properties: 
      - data_type: "list<int32>"
        is_nullable: true
        is_primary: false
        name: edge_list
src_chunk_size: 10
src_type: person
version: gar/v1
